name: Dual Audio Web

on:
  push:
    paths: ['pages/**', 'tests/web-audio.test.cjs', '.github/workflows/web-pages.yml']
  pull_request:
    paths: ['pages/**', 'tests/web-audio.test.cjs', '.github/workflows/web-pages.yml']
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check pages/app.js
      - run: node --test tests/web-audio.test.cjs

# The public mixer is hosted by the portfolio repository at /projects/dual-audio/.
